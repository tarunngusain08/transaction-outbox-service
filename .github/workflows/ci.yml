name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Lint
        run: make lint

      - name: Run unit and integration tests with coverage
        run: make test

      - name: Build JAR and container image
        run: make build

      - name: Verify the local API, PostgreSQL, outbox, and Kafka flow
        run: make traffic

      - name: Stop the local stack
        if: always()
        run: make stop
